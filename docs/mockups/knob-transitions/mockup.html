<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Knob over time</title>
<style>
/* The studio: the lab's dark palette and knob rows, set like a concert programme (serif names, quiet controls),
   so nothing competes with the picture. Section colours are muted hues hashed from each section's bottom widget. */
:root {
  --bg: #08070a; --fg: #e9e2da; --dim: #8d8379; --line: #2a2428; --on: #b43a2a;
  --panel: #0d0a0d; --raised: #1b171b; --card: #110e11; --hover: #5a4b4f;
  --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
  --sans: system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg); }
body { font: 14px/1.45 var(--sans); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: var(--raised); border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--hover); }
button:disabled { opacity: 0.4; cursor: default; }
:focus-visible { outline: 2px solid var(--fg); outline-offset: 2px; }
a { color: var(--fg); text-decoration-color: #e9e2da55; text-underline-offset: 3px; }
a:hover { text-decoration-color: var(--fg); }
code { font-size: 0.92em; background: #1b171b; border-radius: 4px; padding: 1px 5px; }
.dim { color: var(--dim); }
.small { font-size: 12px; }
.err { color: #ff8a7a; font-size: 12px; }
[hidden] { display: none !important; }
svg { display: block; }

button.icon { display: inline-grid; place-items: center; width: 32px; height: 32px; padding: 0; background: transparent; border-color: transparent; color: var(--dim); }
button.icon:hover:not(:disabled) { color: var(--fg); border-color: var(--line); }
button.icon svg { width: 19px; height: 19px; }
button.primary { background: var(--on); border-color: var(--on); color: #fff3ee; }
button.primary:hover:not(:disabled) { background: #c4452f; border-color: #c4452f; }
button.link { background: none; border: none; padding: 2px 0; color: var(--dim); text-decoration: underline; text-underline-offset: 3px; }
button.link:hover { color: var(--fg); }

/* ---- Frame ------------------------------------------------------------------------------------------------- */
.app {
  display: grid; height: 100vh; height: 100dvh;
  grid-template: "top top" auto "work panel" minmax(0, 1fr) / minmax(0, 1fr) clamp(320px, 28vw, 400px);
}
.top { grid-area: top; display: flex; align-items: center; gap: 14px; padding: 10px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
.songs-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px 6px 8px; color: var(--dim); background: transparent; }
.songs-btn svg { width: 18px; height: 18px; }
.songs-btn:hover { color: var(--fg); }
.title { min-width: 0; display: flex; align-items: baseline; gap: 10px; }
.title .composer { color: var(--dim); font-size: 13px; letter-spacing: 0.02em; white-space: nowrap; }
.title h1 { margin: 0; font: 400 21px/1.2 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.save { margin-left: auto; display: flex; align-items: center; gap: 6px; }
.save-state { color: var(--dim); font-size: 12.5px; margin-right: 6px; white-space: nowrap; }
.save-state.dirty { color: #f0c2b4; }
.save-state.dirty::before { content: ""; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--on); margin-right: 7px; vertical-align: 1px; }

.work { grid-area: work; display: flex; flex-direction: column; gap: 10px; padding: 14px 16px 14px; min-height: 0; min-width: 0; }
.stage { position: relative; flex: 1 1 auto; min-height: 160px; background: #000; border-radius: 6px; overflow: hidden; display: grid; }
#c { display: block; width: 100%; height: 100%; min-width: 0; min-height: 0; object-fit: contain; }   /* min 0: a grid item would not shrink below its 16:9 size, and a short stage cropped it */
.stage:fullscreen { border-radius: 0; }
.unhide { position: absolute; right: 14px; bottom: 14px; background: #000a; color: var(--dim); border-color: #e9e2da30; font-size: 12.5px; }
@media (pointer: coarse) { .key-hint { display: none; } }   /* no keyboard to press it on */

.transport { display: flex; align-items: center; gap: 12px; min-width: 0; }
.play { display: grid; place-items: center; width: 42px; height: 42px; padding: 0; border-radius: 50%; background: var(--fg); border: none; color: #08070a; flex: none; }
.play svg { width: 22px; height: 22px; }
.play:hover:not(:disabled) { background: #fff; }
.clock { font-variant-numeric: tabular-nums; white-space: nowrap; }
.now { font: italic 16px/1.2 var(--serif); color: var(--fg); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.spacer { flex: 1; }

/* Export: the menu over the transport, the REC indicator while the song records. */
.export { position: relative; }
.export-btn { display: inline-flex; align-items: center; gap: 7px; padding: 6px 11px 6px 9px; background: transparent; color: var(--dim); }
.export-btn:hover:not(:disabled) { color: var(--fg); }
.export-btn svg { width: 18px; height: 18px; }
.export-menu { position: absolute; right: 0; bottom: calc(100% + 8px); z-index: 20; width: min(340px, calc(100vw - 24px)); display: grid; gap: 10px;
  padding: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 12px 32px #000a; }
.export-menu p { margin: 0; }
.menu-title { font: 400 18px/1.2 var(--serif); }
.presets { display: grid; gap: 4px; margin: 0; padding: 0; border: none; }
.presets legend { padding: 0; margin-bottom: 4px; }
.presets label { display: flex; align-items: baseline; gap: 8px; cursor: pointer; }
.presets input { accent-color: var(--on); margin: 0; transform: translateY(1px); }
.export-menu code { display: inline-block; white-space: nowrap; margin-top: 3px; }
.rec-go { text-align: left; }
.rec-size { display: block; font-size: 12px; opacity: 0.8; }
.rec-ind { display: inline-flex; align-items: center; gap: 10px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.rec-dot { width: 10px; height: 10px; border-radius: 50%; background: #e0402c; box-shadow: 0 0 0 3px #e0402c33; animation: rec-pulse 1.2s ease-in-out infinite; }
.rec-ind.paused .rec-dot { animation: none; background: var(--dim); box-shadow: none; }
.rec-ind button { padding: 4px 10px; font-size: 12.5px; }
@keyframes rec-pulse { 50% { opacity: 0.35; } }
@media (prefers-reduced-motion: reduce) { .rec-dot { animation: none; } }
.recording .timeline-host { opacity: 0.6; pointer-events: none; }

.notices { display: grid; gap: 6px; }
.notices:empty { display: none; }
.notice { display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 12px; background: #140f12; border: 1px solid var(--line); border-left: 3px solid #5b6f8a; border-radius: 5px; font-size: 13px; }
.notice.warn { border-left-color: #c99a3c; }
.notice.error { border-left-color: #d0503c; }
.notice-text { flex: 1; min-width: 0; }
.notice button:not(.icon) { padding: 3px 10px; font-size: 12.5px; }
.notice button.icon { width: 26px; height: 26px; }

/* ---- Timeline ---------------------------------------------------------------------------------------------- */
.timeline { position: relative; user-select: none; -webkit-user-select: none; }
.scrub { position: relative; height: 48px; background: #0d0a0d; border-radius: 5px 5px 0 0; cursor: pointer; touch-action: none; }
.wave { display: block; width: 100%; height: 100%; }
.ghost { position: absolute; top: 0; bottom: 0; width: 1px; background: #e9e2da40; pointer-events: none; display: none; }
.scrub:hover .ghost { display: block; }
.band { position: relative; height: 46px; margin-top: 2px; }
.sec {
  position: absolute; top: 0; bottom: 0; display: flex; flex-direction: column; justify-content: center; gap: 1px;
  /* No padding or border of its own: a block is exactly as wide as its section, however short (the text clips). */
  padding: 0; min-width: 0; border: none; border-radius: 0; text-align: left; overflow: hidden;
  background: hsl(var(--hue, 0) 16% 12%); color: var(--fg); box-shadow: inset 1px 0 0 var(--bg);
}
.sec:first-child { border-radius: 0 0 0 5px; }
.sec:hover:not(:disabled) { background: hsl(var(--hue, 0) 20% 16%); }
.sec.on { background: hsl(var(--hue, 0) 24% 18%); box-shadow: inset 1px 0 0 var(--bg), inset 0 0 0 1.5px var(--on); }
.sec.empty { background: repeating-linear-gradient(135deg, #120e11 0 6px, #0d0a0d 6px 12px); }
.sec-name { padding: 0 8px; font: italic 14px/1.15 var(--serif); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.sec-cast { padding: 0 8px; font-size: 11px; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.handle { position: absolute; top: -6px; bottom: -4px; width: 24px; margin-left: -12px; cursor: ew-resize; touch-action: none; z-index: 2; }
.handle::after { content: ""; position: absolute; left: 11px; top: 6px; bottom: 4px; width: 2px; background: #e9e2da38; border-radius: 1px; }
.handle::before { content: ""; position: absolute; left: 8px; top: 18px; width: 8px; height: 16px; border-radius: 3px; background: #2a2428; border: 1px solid #5a4b4f; opacity: 0; }
.handle:hover::after, .handle.drag::after { background: var(--fg); }
.handle:hover::before, .handle.drag::before, .handle.near::before { opacity: 1; }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: #fff; pointer-events: none; z-index: 3; box-shadow: 0 0 6px #fff6; }
.tip { position: absolute; top: -28px; transform: translateX(-50%); padding: 2px 7px; font-size: 12px; font-variant-numeric: tabular-nums; white-space: nowrap;
  background: #241b20; border: 1px solid #3a2c31; border-radius: 4px; pointer-events: none; z-index: 4; }

/* ---- Panel ------------------------------------------------------------------------------------------------- */
.panel-host { grid-area: panel; min-height: 0; overflow: auto; background: var(--panel); border-left: 1px solid var(--line); overscroll-behavior: contain; }
.panel { padding: 0 16px 28px; }
.tabs { position: sticky; top: 0; z-index: 5; display: flex; gap: 18px; padding: 12px 0 0; background: var(--panel); border-bottom: 1px solid var(--line); margin-bottom: 14px; }
.tabs button { background: none; border: none; border-radius: 0; padding: 4px 0 9px; font: 17px/1.2 var(--serif); color: var(--dim); border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--on); }
.panel h3 { font: 600 13px/1.3 var(--sans); margin: 20px 0 8px; color: var(--fg); }
.panel h3 .dim { font-weight: 400; margin-left: 6px; }
.panel p { margin: 6px 0; }

.sec-nav { display: flex; align-items: center; gap: 4px; font-size: 12.5px; margin-left: -8px; }
.sec-nav button.icon { width: 26px; height: 26px; font-size: 18px; line-height: 1; }
.sec-label { width: 100%; margin: 2px 0 0; padding: 2px 0 3px; font: 400 24px/1.2 var(--serif); background: transparent; border: none; border-bottom: 1px dashed transparent; border-radius: 0; }
.sec-label:hover { border-bottom-color: var(--line); }
.sec-label:focus { outline: none; border-bottom-color: var(--dim); }
.sec-label::placeholder { color: #5f5650; font-style: italic; }
.sec-time { color: var(--dim); font-variant-numeric: tabular-nums; font-size: 13px; margin: 2px 0 12px !important; }
.sec-where { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 8px; color: var(--dim); font-size: 12.5px; margin: -6px 0 12px !important; }
.sec-where[hidden] { display: none; }
.sec-where button { font-size: 12.5px; padding: 2px 9px; }
.sec-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.sec-actions button { font-size: 13px; padding: 5px 11px; }
.fade { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; margin-top: 16px; font-size: 13px; color: var(--dim); }
.fade span { grid-column: 1 / -1; }
.fade input { width: 100%; accent-color: var(--on); margin: 0; }
.fade output { color: var(--fg); font-variant-numeric: tabular-nums; min-width: 44px; text-align: right; }

.layers { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.layer { border: 1px solid var(--line); border-left: 3px solid hsl(var(--hue, 0) 34% 44%); border-radius: 6px; background: var(--card); padding: 6px 6px 6px 10px; min-width: 0; }
.layer.open { background: #160f13; border-color: #3a2c31; border-left-color: hsl(var(--hue, 0) 44% 54%); padding-bottom: 12px; }
.layer.none { border-left-color: var(--line); color: var(--dim); font-size: 13px; padding: 10px 12px; }
.layer-head { display: flex; align-items: center; gap: 2px; }
.layer-name { flex: 1; min-width: 0; display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; background: none; border: none; padding: 4px 0; text-align: left; }
.layer-name b { font-weight: 600; }
.layer .swatch { display: none; }
.layer-tools { display: flex; flex: none; }
.layer-tools button.icon { width: 28px; height: 28px; font-size: 14px; }
.layer .blurb { color: var(--dim); font-size: 13px; margin: 2px 4px 8px 0; }
.layer > p.small { margin: 0 0 2px; }
.layer .link { font-size: 12.5px; margin-top: 10px; }

.add { width: 100%; margin: 0 0 8px; padding: 9px; background: transparent; border: 1px dashed #3a3035; color: var(--dim); }
.add:hover { color: var(--fg); }
.picker { margin: 0 0 14px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
.picker h4 { font: italic 15px/1.3 var(--serif); color: var(--dim); margin: 14px 0 6px; }
.picker ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.pick { width: 100%; display: grid; gap: 2px; text-align: left; background: var(--card); padding: 8px 10px; }
.pick-name { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 6px; }
.pick .swatch { width: 9px; height: 9px; border-radius: 2px; background: hsl(var(--hue, 0) 40% 50%); align-self: center; }
.pick .blurb { color: var(--dim); font-size: 12.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }

.describe { width: 100%; resize: vertical; min-height: 120px; padding: 10px 12px; background: var(--card); border: 1px solid var(--line); border-radius: 6px; font: 15px/1.5 var(--serif); }
.describe:focus { outline: none; border-color: var(--dim); }
.row-end { display: flex; align-items: center; justify-content: flex-end; gap: 10px; margin-top: 8px; }
.facts { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 0; font-size: 13px; }
.facts dt { color: var(--dim); }
.facts dd { margin: 0; }
.errs { padding-left: 18px; color: #ff8a7a; font-size: 12.5px; }

/* The lab's tags and knob rows (lab/index.html), unchanged in look. */
.tag { display: inline-block; font-size: 10.5px; line-height: 1; padding: 3px 6px 3px; border-radius: 9px; font-weight: 600; letter-spacing: 0.02em; white-space: nowrap; }
.tag.v-love { color: #c8f0d2; background: #1d4a2b; }
.tag.v-keep { color: #cfe0f5; background: #213a5c; }
.tag.v-work { color: #f7deb0; background: #5a3e12; }
.tag.v-drop { color: #ffb9ab; background: #3a1a1c; }
.tag.v-none { color: #b9b0a7; background: #2a2428; font-weight: 500; }
.tag.v-rev { color: #f7deb0; background: transparent; border: 1px solid #5a3e12; font-weight: 500; }
.params { margin-top: 4px; display: grid; gap: 9px; }
.prm { position: relative; font-size: 12px; color: var(--dim); }
.prm .top { display: grid; grid-template-columns: 40px 1fr auto auto; gap: 6px; align-items: center; }
.prm .name { color: var(--fg); min-width: 0; line-height: 1.2; }
.prm .info { padding: 0 6px; font-size: 11px; line-height: 16px; border-radius: 50%; color: var(--dim); font-style: italic; font-family: Georgia, serif; }
.prm .row { display: grid; grid-template-columns: 40px 1fr 40px; gap: 6px; align-items: center; margin-top: 3px; }
.prm.plain { display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'name sel' 'slider slider'; gap: 1px 6px; align-items: center; }
.prm.plain .name { grid-area: name; color: var(--dim); } .prm.plain select { grid-area: sel; } .prm.plain input { grid-area: slider; }
.prm input { width: 100%; accent-color: var(--on); margin: 0; }
.prm select { background: #1b171b; color: var(--fg); border: 1px solid var(--line); border-radius: 4px; font-size: 11px; max-width: 124px; }
.prm canvas { display: block; width: 40px; height: 26px; border-radius: 3px; background: #0a080a; }
.prm canvas.live { background: #241b20; box-shadow: 0 0 0 1px #3a2c31; }
.prm .hint { display: none; color: #cbbfb4; font-size: 12px; line-height: 1.4; padding: 4px 0 0 46px; }
.prm.open .hint { display: block; }
@media (hover: hover) {
  .prm:not(.open):hover .hint { display: block; position: absolute; z-index: 5; left: 46px; right: 0; bottom: 100%; margin-bottom: 4px;
    padding: 6px 8px; background: #241b20; border: 1px solid #3a2c31; border-radius: 5px; box-shadow: 0 4px 14px #000a; }
}

/* ---- Poster and empty state --------------------------------------------------------------------------------- */
.poster { position: absolute; inset: 0; display: grid; place-items: center; background: #000; z-index: 2; padding: 20px; }
.poster-inner { display: grid; justify-items: center; gap: 12px; background: none; border: none; color: var(--fg); text-align: center; max-width: 60ch; }
button.poster-inner:hover .poster-play { border-color: var(--fg); }
.poster .composer { color: var(--dim); font-size: 14px; letter-spacing: 0.04em; }
.poster-title { font: 400 clamp(26px, 4vw, 54px)/1.1 var(--serif); }
.poster-play { display: inline-flex; align-items: center; gap: 8px; margin-top: 10px; padding: 9px 22px 9px 16px; border: 1px solid #e9e2da55; border-radius: 999px; font-size: 15px; }
.poster-play svg { width: 20px; height: 20px; }
.poster.empty h2 { margin: 0; font: 400 clamp(26px, 3.4vw, 44px)/1.15 var(--serif); }
.poster.empty p { color: var(--dim); margin: 0; line-height: 1.6; }
.poster.empty .links { display: flex; gap: 22px; justify-content: center; flex-wrap: wrap; margin-top: 8px; }
.no-song .transport, .no-song .timeline-host, .no-song .panel-host { display: none; }
.no-song .app { grid-template: "top" auto "work" minmax(0, 1fr) / 1fr; }
.fatal { margin: 20px; color: #ff8a7a; }

/* ---- Library ----------------------------------------------------------------------------------------------- */
.library { position: fixed; inset: 0; z-index: 50; }
.library-scrim { position: absolute; inset: 0; background: #000b; }
.library-sheet { position: absolute; left: 0; top: 0; bottom: 0; width: min(400px, 92vw); display: flex; flex-direction: column; gap: 10px;
  padding: 14px 16px 18px; background: var(--panel); border-right: 1px solid var(--line); overflow: auto; }
.library-sheet header { display: flex; align-items: center; justify-content: space-between; }
.library-sheet h2 { margin: 0; font: 400 22px/1.2 var(--serif); }
.songs { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.song { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); text-decoration: none; }
.song:hover { border-color: var(--hover); }
.song.on { border-color: var(--on); background: #1d1013; }
.song-title { display: grid; }
.song-title .composer { color: var(--dim); font-size: 12.5px; }
.song-title .piece { font: 400 18px/1.25 var(--serif); }
.song-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--dim); font-variant-numeric: tabular-nums; }
.badge { padding: 2px 7px; border-radius: 9px; background: #2a2428; color: #cfc6bc; font-size: 11px; }
.badge.n-gpu, .badge.n-file { background: #1d3a26; color: #c8f0d2; }
.badge.n-approx, .badge.n-merged { background: #4a3412; color: #f7deb0; }
.badge.n-hybrid, .badge.n-ymt3, .badge.n-bp-hybrid { background: #1d3a26; color: #c8f0d2; }
.badge.show-own { background: #213a5c; color: #cfe0f5; }
/* Adding a recording: the picker, the progress, and the whole page as a drop zone. */
.add-song { display: grid; gap: 6px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.add-btn { justify-self: start; display: inline-flex; align-items: center; padding: 7px 14px; border: 1px solid var(--line); border-radius: 6px; background: var(--raised); cursor: pointer; font-size: 14px; }
.add-btn:hover, .add-btn:focus-within { border-color: var(--hover); }
.add-btn:focus-within { outline: 2px solid var(--on); outline-offset: 2px; }
.add-btn.busy { opacity: 0.5; pointer-events: none; }
.add-btn input { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
.add-how { margin: 0; line-height: 1.5; }
.adding { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--card); }
.adding[hidden] { display: none; }
.adding-head { display: flex; align-items: center; gap: 8px; min-width: 0; }
.adding-name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 400 16px/1.3 var(--serif); }
.adding-msg { margin: 0; line-height: 1.45; font-variant-numeric: tabular-nums; }
.bar { height: 4px; border-radius: 2px; background: #2a2428; overflow: hidden; }
.bar i { display: block; height: 100%; width: 0; background: var(--on); transition: width 0.3s; }
.drop-overlay { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; background: #08070ad9; border: 2px dashed #e9e2da55; pointer-events: none; }
.drop-overlay[hidden] { display: none; }
.drop-overlay div { display: grid; gap: 8px; text-align: center; padding: 16px; }
.drop-title { font: 400 clamp(26px, 4vw, 44px)/1.15 var(--serif); }
.library-sheet footer { margin-top: auto; display: grid; grid-template-columns: auto 1fr; gap: 6px 10px; align-items: baseline; padding-top: 14px; border-top: 1px solid var(--line); font-size: 13px; }
.library-sheet footer .dim { font-size: 12px; }

/* ---- Hidden controls, full screen, resting cursor --------------------------------------------------------- */

$('[data-play]').onclick = togglePlay;
function frame(ts) {
  if (playing) { if (lastFrame) now = Math.min(DUR, now + (ts - lastFrame) / 1000); lastFrame = ts; if (now >= DUR) togglePlay(); dirty = true; }
  if (dirty) {
    dirty = false;
    drawStage();
    for (const v of views) drawLane(v);
    placeHead();
    for (const r of rows) r.tick();
    syncWhere();
    $('[data-clock]').textContent = clock(now);
    $('[data-now]').textContent = show.sections[sectionAt(now)].label;
    $('[data-head]').style.left = `${(now / DUR) * 100}%`;
  }
  requestAnimationFrame(frame);
}
new ResizeObserver(() => { drawWave(); dirty = true; }).observe($('.tl-top'));
new ResizeObserver(() => { dirty = true; }).observe($('.stage'));
new ResizeObserver(() => { document.documentElement.style.setProperty('--top-h', `${$('.app > .top').offsetHeight}px`); }).observe($('.app > .top'));
if (innerWidth <= 900) $('.try').open = false;
refresh();
drawWave();
requestAnimationFrame(frame);
if (innerWidth > 900) { const o = $('.layer.open', body); if (o) panelHost.scrollTop = o.getBoundingClientRect().top - panelHost.getBoundingClientRect().top - $('.tabs', body).offsetHeight - 22; }

// for checks
window.__mock = { show: () => show, initial: () => JSON.stringify(initial), seek, ui, now: () => now, hist };
})();

</script>
